<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Creator 5 Pro</title>
<style>
  :root{--bg:#0b0e13;--panel:#151a22;--edge:#242b36;--text:#e8edf4;--muted:#8a94a4;--accent:#d8a74a;--warn:#e5484d;--good:#3ecf8e}
  *{box-sizing:border-box}
  body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:12px 12px 24px;display:grid;gap:12px}
  header{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
  h1{font-size:18px;margin:0;font-weight:600}
  .pill{font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--edge);color:var(--muted)}
  .pill[data-k="printing"]{border-color:var(--accent);color:var(--accent)}
  .pill[data-k="paused"]{border-color:var(--warn);color:var(--warn)}
  .pill[data-k="offline"],.pill[data-k="error"]{border-color:var(--warn);color:var(--warn)}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;overflow:hidden}
  .cam{position:relative;aspect-ratio:4/3;background:#000}
  .cam img{width:100%;height:100%;object-fit:contain;display:block}
  .cam .off{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:16px}
  .live{position:absolute;left:10px;top:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff}
  .live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:6px;animation:b 1.6s infinite}
  @keyframes b{50%{opacity:.3}}
  .job{padding:12px 14px;display:grid;gap:8px}
  .file{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:8px;background:var(--edge);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s}
  .row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
  .btns{display:flex;gap:10px;padding:0 14px 14px}
  button{flex:1;padding:14px;border-radius:10px;border:1px solid var(--edge);background:#1c232e;color:var(--text);font:600 16px system-ui}
  button:disabled{opacity:.35}
  button.primary{background:var(--accent);color:#1a1206;border-color:var(--accent)}
  button#light{flex:0 0 auto;min-width:88px}
  button#light.on{border-color:var(--good);color:var(--good)}
  .note{padding:0 14px 12px;font-size:13px;color:var(--muted)}
  .note[data-k="warn"]{color:var(--warn)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--edge)}
  .grid div{background:var(--panel);padding:10px 12px}
  .grid b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
  .grid span{font-variant-numeric:tabular-nums;font-size:15px}
  .slots{display:flex;gap:8px;padding:12px 14px}
  .slot{flex:1;border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;border:1px solid var(--edge);background:#1c232e;color:var(--muted)}
  .slot i{display:block;width:100%;height:10px;border-radius:5px;margin-bottom:6px;background:#2a3140}
  .slot.full{color:var(--text)}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:4px}
</style>
</head>
<body>
<main>
  <header><h1 id="title">Creator 5 Pro</h1><span class="pill" id="pill">connecting</span></header>

  <section class="card">
    <div class="cam"><img id="cam" alt="Live camera"><span class="live" id="live" hidden>live</span><div class="off" id="camOff">Connecting to the camera…</div></div>
  </section>

  <section class="card">
    <div class="job">
      <div class="file" id="file">Idle</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="row"><span id="layer"></span><span id="pct"></span><span id="time"></span></div>
    </div>
    <div class="btns">
      <button id="pause" class="primary" disabled>Pause</button>
      <button id="resume" disabled>Resume</button>
      <button id="light" disabled title="Chamber light">Light</button>
    </div>
    <div class="note" id="note" hidden></div>
  </section>

  <section class="card"><div class="grid" id="temps"></div></section>
  <section class="card"><div class="slots" id="slots"></div></section>

  <footer id="foot">flashforge-obico</footer>
</main>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var fmt = function(s){ s = Math.max(0, Math.round(s||0)); var h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? h+"h "+m+"m" : m+"m"; };
  var t1 = function(v){ return (v === null || v === undefined) ? "–" : Math.round(v); };

  /* ── camera: a plain <img> on the MJPEG stream; a frozen picture is detected by fingerprinting
        the frame on screen every 5 s (same origin, so the canvas is readable) and reconnected. ── */
  var cam = $("cam"), canvas = document.createElement("canvas"), lastPrint = null, lastChange = Date.now(), camUrl = null;
  function connectCamera(url){
    camUrl = url; lastPrint = null; lastChange = Date.now();
    $("live").hidden = true; $("camOff").hidden = false; $("camOff").textContent = "Connecting to the camera…";
    cam.src = url + "?t=" + Date.now();
  }
  cam.onload = function(){ $("camOff").hidden = true; };   /* single images only; an MJPEG <img> never fires load */
  setInterval(function(){ if (camUrl && cam.naturalWidth) $("camOff").hidden = true; }, 500);
  cam.onerror = function(){ $("live").hidden = true; $("camOff").hidden = false; $("camOff").textContent = "Camera unavailable — retrying…"; };
  setInterval(function(){
    if (!camUrl || !cam.naturalWidth) return;
    var w = cam.naturalWidth, h = cam.naturalHeight;
    if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
    var ctx = canvas.getContext("2d", { willReadFrequently:true }); ctx.drawImage(cam, 0, 0);
    var d = ctx.getImageData(0, 0, w, h).data, hash = 2166136261 ^ d.length;
    for (var i = 0; i < d.length; i += 389){ hash ^= d[i]; hash = (hash * 16777619) >>> 0; }
    if (hash !== lastPrint){ lastPrint = hash; lastChange = Date.now(); $("live").hidden = false; $("camOff").hidden = true; }
    else if (Date.now() - lastChange > 15000) connectCamera(camUrl);
  }, 5000);

  /* ── status ── */
  var busy = false, lightOn = false;
  function render(st){
    var p = st.printer;
    $("title").textContent = (p && p.model) || "Creator 5 Pro";
    var k = !st.connected ? "offline" : p.error_code ? "error" : p.paused ? "paused" : p.warming_up ? "warming" : p.has_job ? "printing" : "ready";
    $("pill").textContent = k === "warming" ? "warming up" : k; $("pill").dataset.k = k;
    if (st.camera && st.camera !== camUrl) connectCamera(st.camera);
    if (!p){ $("light").disabled = true; $("file").textContent = "Printer not reachable"; $("bar").style.width = "0"; $("layer").textContent = $("pct").textContent = $("time").textContent = ""; $("pause").disabled = $("resume").disabled = true; return; }
    $("file").textContent = p.has_job ? (p.file || "Printing") : "Idle";
    $("bar").style.width = (p.has_job ? p.progress*100 : 0) + "%";
    $("pct").textContent = p.has_job ? Math.round(p.progress*100) + "%" : "";
    $("layer").textContent = p.has_job && p.total_layers ? "layer " + (p.layer||0) + " / " + p.total_layers : "";
    $("time").textContent = p.has_job ? (p.warming_up ? "warming up" : fmt(p.duration_s) + " · " + fmt(p.remaining_s) + " left") : "";
    $("pause").disabled = busy || !p.can_pause; $("resume").disabled = busy || !p.can_resume;
    $("light").disabled = busy; $("light").className = p.light_on ? "on" : ""; $("light").textContent = p.light_on ? "Light on" : "Light off";
    lightOn = !!p.light_on;
    var note = $("note"), pending = st.obico.pending_command;
    if (pending){ note.hidden = false; note.dataset.k = "warn"; note.textContent = "Pause requested: the printer ignores it while warming up; it will pause when the first layer starts."; }
    else if (p.error_code){ note.hidden = false; note.dataset.k = "warn"; note.textContent = "Printer error " + p.error_code; }
    else note.hidden = true;
    var T = p.temperatures, cells = "";
    T.nozzles.forEach(function(n){ cells += "<div><b>Tool " + n.tool + "</b><span>" + t1(n.current) + " / " + t1(n.target) + " °C</span></div>"; });
    cells += "<div><b>Bed</b><span>" + t1(T.bed.current) + " / " + t1(T.bed.target) + " °C</span></div>";
    cells += "<div><b>Chamber</b><span>" + t1(T.chamber.current) + " / " + t1(T.chamber.target) + " °C</span></div>";
    $("temps").innerHTML = cells;
    $("slots").innerHTML = (p.slots.length ? p.slots : [1,2,3,4].map(function(i){ return {slot_id:i}; })).map(function(s){
      return '<div class="slot' + (s.has_filament ? ' full' : '') + '"><i style="background:' + (s.has_filament && s.color ? s.color : '#2a3140') + '"></i>' + (s.has_filament ? (s.material || "loaded") : "empty") + '</div>';
    }).join("");
    $("foot").textContent = "flashforge-obico " + st.version + " · Obico " + (st.obico.connected ? "connected" : "disconnected") + (p.light_on ? " · light on" : "") + (p.door_open ? " · door open" : "");
  }
  function poll(){
    fetch("/api/status", { cache:"no-store" }).then(function(r){ return r.json(); }).then(render)
      .catch(function(){ $("pill").textContent = "agent unreachable"; $("pill").dataset.k = "offline"; });
  }
  function job(action){
    busy = true; $("pause").disabled = $("resume").disabled = true;
    fetch("/api/job", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action: action }) })
      .catch(function(){}).then(function(){ setTimeout(function(){ busy = false; poll(); }, 1500); });
  }
  $("light").onclick = function(){
    busy = true; $("light").disabled = true;
    fetch("/api/light", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ on: !lightOn }) })
      .catch(function(){}).then(function(){ setTimeout(function(){ busy = false; poll(); }, 800); });
  };
  $("pause").onclick = function(){ job("pause"); };
  $("resume").onclick = function(){ job("resume"); };
  poll(); setInterval(poll, 2000);
})();
</script>
</body>
</html>
